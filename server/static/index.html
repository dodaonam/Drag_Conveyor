<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <title>Kiểm tra băng tải</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>

<body>

  <!-- ══════════════════════════════════════════════════════════════════
     Screen: LOGIN
═══════════════════════════════════════════════════════════════════ -->
  <div id="s-login" class="s">
    <div class="body body-center">
      <div class="panel">
        <div class="login-logo">
          <div style="font-size:48px;margin-bottom:8px">⚙️</div>
          <h1>Kiểm tra băng tải</h1>
          <p>Hệ thống phát hiện lỗi thanh trắng</p>
        </div>
        <div class="card">
          <div style="margin-bottom:14px">
            <label class="lbl" for="inp-inspector">Tên người kiểm tra</label>
            <input type="text" id="inp-inspector" placeholder="Nhập tên người kiểm tra" autocomplete="name">
          </div>
          <div style="margin-bottom:14px">
            <label class="lbl" for="inp-conveyor">Băng chuyền</label>
            <input type="text" id="inp-conveyor" placeholder="Nhập tên băng chuyền" autocomplete="off">
          </div>
          <div style="margin-bottom:14px">
            <label class="lbl" for="inp-token">Mã truy cập</label>
            <input type="password" id="inp-token" placeholder="Nhập mã truy cập" autocomplete="current-password">
          </div>
          <button class="btn btn-primary" id="btn-login">Đăng nhập</button>
          <div id="err-login" class="err" style="margin-top:12px"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════════
     Screen: SETUP
═══════════════════════════════════════════════════════════════════ -->
  <div id="s-setup" class="s">
    <div class="hdr">
      <div class="shell" style="display:flex;align-items:center;gap:10px">
        <span>Tạo kiểm tra mới</span>
        <span id="hdr-session-setup" style="font-size:13px;font-weight:400;opacity:0.8;margin-left:4px"></span>
        <button class="hdr-aux" id="btn-logout">Đăng xuất</button>
      </div>
    </div>
    <div class="body">
      <div class="shell setup-grid">
        <div class="setup-side">

          <!-- Video picker -->
          <div class="card">
            <label class="lbl">Video băng tải</label>
            <input type="file" id="inp-video" accept="video/*" style="display:none">
            <button class="btn btn-outline" id="btn-pick">Chọn video</button>
            <div id="video-name" style="font-size:13px;color:var(--muted);margin-top:8px;display:none"></div>
          </div>

        </div>

        <div class="setup-main">
          <!-- ROI setup (shown after video selected) -->
          <div id="roi-section" style="display:none">

            <div class="card card-tight">
              <label class="lbl" style="margin-bottom:8px">Vùng kiểm tra (ROI)</label>
              <div id="canvas-wrap">
                <canvas id="roi-canvas"></canvas>
                <div id="canvas-hint">Bấm Chọn vùng chụp để bắt đầu</div>
              </div>
              <div class="roi-actions">
                <button class="btn btn-outline btn-sm btn-main" id="btn-edit-roi">Chọn vùng chụp</button>
                <button class="btn btn-outline btn-sm btn-done" id="btn-lock-roi" disabled>✓</button>
                <span id="roi-status" style="font-size:13px;color:var(--muted)">Chưa chọn vùng</span>
              </div>
            </div>

            <div id="err-setup" class="err"></div>
            <button class="btn btn-primary" id="btn-submit" style="padding:16px;font-size:17px">
              Bắt đầu kiểm tra
            </button>

          </div><!-- /roi-section -->
        </div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════════
     Screen: UPLOADING
═══════════════════════════════════════════════════════════════════ -->
  <div id="s-uploading" class="s">
    <div class="hdr">
      <div class="shell"><span>Đang tải lên</span></div>
    </div>
    <div class="body body-center">
      <div class="card panel" style="text-align:center;padding:32px 20px">
        <p style="font-size:15px;color:var(--muted);margin-bottom:20px">Đang tải video lên máy chủ…</p>
        <div class="prog-wrap">
          <div class="prog-bar" id="prog-bar"></div>
        </div>
        <div class="prog-pct" id="prog-pct">0%</div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════════
     Screen: POLLING
═══════════════════════════════════════════════════════════════════ -->
  <div id="s-polling" class="s">
    <div class="hdr">
      <div class="shell"><span>Đang xử lý</span></div>
    </div>
    <div class="body body-center">
      <div class="card panel" style="padding:24px 20px">
        <div class="spinner"></div>
        <div class="poll-msg" id="poll-msg">Đang chờ xử lý…</div>
        <div class="poll-detail" id="poll-detail">Xin chờ trong giây lát</div>
        <div id="err-poll" class="err" style="margin-top:14px"></div>
        <button class="btn btn-outline btn-sm" id="btn-cancel-poll" style="margin-top:20px">
          Huỷ và quay lại
        </button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════════
     Screen: RESULT
═══════════════════════════════════════════════════════════════════ -->
  <div id="s-result" class="s">
    <div class="hdr">
      <div class="shell" style="display:flex;align-items:center;gap:10px">
        <span>Kết quả kiểm tra</span>
        <span id="hdr-session-result" style="font-size:13px;font-weight:400;opacity:0.8;margin-left:4px"></span>
      </div>
    </div>
    <div class="body">
      <div class="shell result-grid">
        <div class="result-side">

          <!-- Summary counts -->
          <div class="card">
            <label class="lbl">Tổng kết</label>
            <div class="stat-grid" id="stat-grid"></div>
          </div>

          <!-- No defects -->
          <div id="no-defect" class="card ok-banner" style="display:none">
            <div class="icon">✅</div>
            <h2>Không phát hiện lỗi</h2>
            <p>Tất cả thanh đều đạt tiêu chuẩn</p>
          </div>

          <button class="btn btn-primary" id="btn-new-job">Kiểm tra tiếp</button>
        </div>

        <div class="result-main">
          <!-- Gallery tabs -->
          <div id="gallery-tabs" style="display:none">
            <div class="tab-bar">
              <button class="tab-btn" id="tab-btn-defect" onclick="switchTab('defect')">
                Thanh lỗi (<span id="tab-count-defect">0</span>)
              </button>
              <button class="tab-btn" id="tab-btn-normal" onclick="switchTab('normal')">
                Bình thường (<span id="tab-count-normal">0</span>)
              </button>
            </div>
            <div id="panel-defect">
              <div id="defect-subtabs"></div>
              <div class="defects" id="defect-list"></div>
            </div>
            <div id="panel-normal" style="display:none">
              <div class="defects" id="normal-list"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <div class="lightbox-panel">
      <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Đóng ảnh">×</button>
      <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="Ảnh trước">‹</button>
      <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="Ảnh sau">›</button>
      <img id="lightbox-image" class="lightbox-image" alt="Ảnh lỗi phóng to">
      <div id="lightbox-meta" class="lightbox-meta"></div>
    </div>
  </div>

  <script src="/static/app.js" defer></script>
</body>

</html>
