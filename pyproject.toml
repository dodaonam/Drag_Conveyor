[project]
name = "drag-conveyor"
version = "0.1.0"
description = "White bar inspection runtime for drag conveyor defect screening."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.24",
    "fastapi>=0.115.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "onnxruntime>=1.27.0",
    "opencv-python>=4.13.0.92",
    "pydantic>=2.0",
    "python-dotenv>=1.2.2",
    "qrcode>=8.2",
    "uvicorn[standard]>=0.30.0",
    "pdfkit>=1.0",
]

[project.optional-dependencies]
gui = [
    "qrcode>=8.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drag_conveyor*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
