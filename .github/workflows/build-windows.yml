name: Build Windows EXE

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Rebuild PyInstaller bootloader from source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $piVersion = uv run python -c "import PyInstaller; print(PyInstaller.__version__)"
          $bootDir   = uv run python -c "import PyInstaller, os; print(os.path.join(os.path.dirname(PyInstaller.__file__), 'bootloader', 'Windows-64bit-intel'))"
          Write-Host "PyInstaller $piVersion - bootloader dir: $bootDir"
          git clone --depth 1 --branch "v$piVersion" https://github.com/pyinstaller/pyinstaller.git C:\pi_src
          Set-Location C:\pi_src\bootloader
          uv run python waf all --target-arch=64bit
          Set-Location $env:GITHUB_WORKSPACE
          $run  = "C:\pi_src\bootloader\build\release\run.exe"
          $runw = "C:\pi_src\bootloader\build\releasew\runw.exe"
          if (-not (Test-Path $runw)) { throw "runw.exe not found at $runw" }
          Copy-Item $run  "$bootDir\run.exe"  -Force
          Copy-Item $runw "$bootDir\runw.exe" -Force
          Remove-Item C:\pi_src -Recurse -Force

      - name: Build with PyInstaller
        run: uv run pyinstaller DragConveyor.spec --clean

      - name: Copy vendor binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist\DragConveyor\bin | Out-Null
          Copy-Item vendor\cloudflared.exe  dist\DragConveyor\bin\
          Copy-Item vendor\wkhtmltopdf.exe  dist\DragConveyor\bin\

      - name: Package zip
        shell: powershell
        run: Compress-Archive -Path dist\DragConveyor -DestinationPath DragConveyor_v${{ github.run_number }}.zip -Force

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Build v${{ github.run_number }}"
          body: "Commit: ${{ github.sha }}"
          files: DragConveyor_v${{ github.run_number }}.zip
