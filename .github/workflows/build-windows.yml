name: Build Windows EXE

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ── Build tag: dd.mm.yy-N (e.g. 02.07.26-39) ────────────────────────────
      - name: Set build tag
        id: tag
        shell: pwsh
        run: |
          $date = Get-Date -Format "dd.MM.yy"
          $tag  = "${date}-${{ github.run_number }}"
          echo "value=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Build tag: $tag"

      # ── setup-uv v8 với built-in package cache ───────────────────────────────
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      # ── Cache Nuitka C compilation (clcache — built-in MSVC cache) ───────────
      # Confirmed default path: %LOCALAPPDATA%\Nuitka\Nuitka\Cache
      # (appdirs appauthor=None → fallback = appname → "Nuitka\Nuitka")
      # restore-keys allows partial hit từ commit trước → tái dùng compiled .obj
      - name: Cache Nuitka compilation
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ runner.arch }}-

      # ── Install dependencies (creates venv first, then add build/service extras) ─
      - name: Install dependencies
        run: |
          uv sync
          uv pip install nuitka ordered-set pywin32

      # ── Build tunnel_service (Nuitka standalone) ──────────────────────────────
      # --lto=no: tắt Link Time Optimization (/LTCG) — giảm thời gian link đáng kể
      # --lto valid values: "yes", "no", "auto" (default auto → bật với MSVC)
      # NOTE: --windows-service (nuitka-winsvc) removed — pywin32's HandleCommandLine
      # already calls StartServiceCtrlDispatcher; the extra layer caused error 1053.
      - name: Build tunnel_service
        shell: pwsh
        run: |
          uv run python -m nuitka `
            --assume-yes-for-downloads `
            --lto=no `
            --mode=standalone `
            --include-module=servicemanager `
            --include-module=win32service `
            --include-module=win32serviceutil `
            --include-module=win32event `
            --include-package=win32timezone `
            --output-filename=tunnel_service `
            --output-dir=dist/tunnel_service_build `
            tunnel_service/service.py

      # ── Build DragConveyor with Nuitka ───────────────────────────────────────
      - name: Build DragConveyor with Nuitka
        run: uv run python -m nuitka --assume-yes-for-downloads --lto=no gui/__main__.py

      # Nuitka 4.x may name the .dist dir after --output-filename (DragConveyor.dist)
      # or after the script stem (__main__.dist). Find whichever exists and rename it.
      # Rename-Item requires a plain name (no path separators) for -NewName.
      - name: Rename Nuitka output directory
        shell: pwsh
        run: |
          $dist = Get-ChildItem dist -Directory | Where-Object { $_.Name -like "*.dist" } | Select-Object -First 1
          if (-not $dist) { Write-Error "No .dist directory found in dist\"; exit 1 }
          Write-Host "Found: $($dist.Name) — renaming to DragConveyor"
          Rename-Item $dist.FullName DragConveyor

      # ── Security check: secrets must NOT be bundled ───────────────────────────
      - name: Verify secrets not bundled
        shell: pwsh
        run: |
          if (Test-Path "dist\DragConveyor\server\.env") {
            Write-Error "SECURITY: server\.env was bundled into dist!"
            exit 1
          }
          if (Test-Path "dist\DragConveyor\config\app_settings.json") {
            Write-Error "SECURITY: config\app_settings.json was bundled into dist!"
            exit 1
          }
          Write-Host "Security check passed: no secrets in dist."

      # ── Copy vendor binaries ─────────────────────────────────────────────────
      - name: Copy vendor binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\DragConveyor\bin\tunnel_service | Out-Null
          Copy-Item vendor\cloudflared.exe  dist\DragConveyor\bin\
          Copy-Item vendor\wkhtmltopdf.exe  dist\DragConveyor\bin\
          # Nuitka names the .dist dir after --output-filename (tunnel_service.dist)
          # or after the script stem (service.dist) depending on version — handle both.
          $svcDist = if (Test-Path "dist\tunnel_service_build\tunnel_service.dist") {
            "dist\tunnel_service_build\tunnel_service.dist"
          } else {
            "dist\tunnel_service_build\service.dist"
          }
          if (-not (Test-Path $svcDist)) {
            Write-Error "tunnel_service .dist directory not found (checked tunnel_service.dist and service.dist)"
            exit 1
          }
          Write-Host "Copying tunnel_service dist from: $svcDist"
          Copy-Item "$svcDist\*" "dist\DragConveyor\bin\tunnel_service\" -Recurse -Force

      # ── Build installer ───────────────────────────────────────────────────────
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      # ── Package zip ───────────────────────────────────────────────────────────
      - name: Package zip
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.value }}"
          Compress-Archive -Path dist\DragConveyor `
            -DestinationPath "DragConveyor_${tag}.zip" -Force

      # ── Upload artifacts to GitHub Releases ──────────────────────────────────
      # overwrite: true — tránh lỗi HTTP 422 khi re-run cùng tag
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          body: "Commit: ${{ github.sha }}"
          overwrite_files: true
          files: |
            DragConveyor_Setup.exe
            DragConveyor_${{ steps.tag.outputs.value }}.zip
